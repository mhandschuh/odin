[package]
name = "yggdrasil"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "0.36.2", features = ["persistence"] }
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular", "fill"] }
libc = "0.2.190"
notify = "8.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
yggdrasil-core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSBundle", "NSError", "NSObject", "NSValue", "NSGeometry", "NSArray", "NSAttributedString", "NSRange", "NSObjCRuntime"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSTextInputClient", "NSGraphicsContext", "NSApplication", "NSMenu", "NSMenuItem"] }
raw-window-handle = "0.6"
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger", "UNNotificationSound", "block2"] }

[dev-dependencies]
tempfile = "3"
