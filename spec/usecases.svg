<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" role="img" aria-label="Yggdrasil use-case diagram">
<style>
text { fill: #24201b; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
.box { fill: none; stroke: #6d655b; stroke-width: 1.5; } .title { font-weight: 700; font-size: 15px; }
.edge { stroke: #6d655b; stroke-width: 1.2; } .rel { stroke: #6d655b; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
.stereo { font-size: 11px; fill: #6d655b; } .aname { font-weight: 650; }
.actor { stroke: #24201b; stroke-width: 2; fill: none; }
.u-red { fill: #f7e3e0; stroke: #b8483e; stroke-width: 1.5; } .u-half { fill: #f8ecd2; stroke: #a66a00; stroke-width: 1.5; }
.u-green { fill: #e1f1e6; stroke: #2f7d4f; stroke-width: 1.5; } .head { fill: #6d655b; }
@media (prefers-color-scheme: dark) {
  text { fill: #ece6dc; } .box, .edge, .rel { stroke: #a39a8c; } .stereo { fill: #a39a8c; } .actor { stroke: #ece6dc; }
  .u-red { fill: #3c1f1c; stroke: #f09088; } .u-half { fill: #3a2c12; stroke: #f0bd5c; } .u-green { fill: #183324; stroke: #7fd3a0; }
  .head { fill: #a39a8c; } }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="230" y="20" width="600" height="340" rx="10" class="box"/>
