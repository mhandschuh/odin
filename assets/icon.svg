<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Odin's ravens, Huginn and Muninn, flying out over the world and back with what they saw (the app's agents). -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#26262a"/>
  <!-- the world they fly over, and their path around it -->
  <circle cx="512" cy="512" r="96" fill="#f0904a"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#f0904a" stroke-width="18" stroke-dasharray="6 46" stroke-linecap="round" opacity="0.7"/>
  <!-- a raven: body, head, beak, raised wings, fanned tail -->
  <defs><g id="raven" fill="#f0904a">
    <path d="M0,0 C-30,-40 -110,-70 -170,-50 C-120,-30 -80,-10 -60,10 C-110,10 -160,30 -190,70 C-120,60 -60,45 -20,30 C10,45 50,48 80,36 L120,30 L86,14 C70,-10 40,-14 0,0 Z"/>
    <circle cx="78" cy="22" r="7" fill="#26262a"/>
  </g></defs>
  <use href="#raven" transform="translate(470 248) rotate(18) scale(1.15)"/>
  <use href="#raven" transform="translate(560 778) rotate(198) scale(1.15)"/>
</svg>
