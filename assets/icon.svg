<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Odin's ravens, Huginn and Muninn, flying around the world and back with what they saw (the app's agents); the Pantheon's Mocha tile, as Heimdall's. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34364e"/>
      <stop offset="0.55" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#89b4fa" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#b4befe"/>
    </linearGradient>
    <linearGradient id="iris" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#b4d0ff"/>
      <stop offset="0.45" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#7c6df0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b0b13" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tileclip"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
    <radialGradient id="world" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#d6e4ff"/>
      <stop offset="0.45" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#5b4fd0"/>
    </radialGradient>
    <g id="raven">
      <path d="M0,0 C-30,-40 -110,-70 -170,-50 C-120,-30 -80,-10 -60,10 C-110,10 -160,30 -190,70 C-120,60 -60,45 -20,30 C10,45 50,48 80,36 L120,30 L86,14 C70,-10 40,-14 0,0 Z" fill="url(#paper)"/>
      <circle cx="78" cy="22" r="7" fill="#1e1e2e"/>
    </g>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="188" fill="#000" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#tile)"/>
  <g clip-path="url(#tileclip)">
    <circle cx="512" cy="512" r="470" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="300" fill="url(#rim)" opacity="0.22"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="186" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- their path around the world -->
  <circle cx="512" cy="512" r="228" fill="none" stroke="#b4befe" stroke-width="14" stroke-dasharray="4 40"
          stroke-linecap="round" opacity="0.6"/>
  <!-- the world -->
  <g filter="url(#soft)"><circle cx="512" cy="512" r="108" fill="url(#world)"/></g>
  <path d="M430 470 C470 450 520 480 560 460 M420 540 C470 520 540 560 600 530" fill="none" stroke="#ffffff"
        stroke-opacity="0.35" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="470" cy="455" rx="30" ry="18" fill="#ffffff" fill-opacity="0.7" transform="rotate(-30 470 455)"/>
  <!-- the ravens -->
  <g filter="url(#soft)">
    <use href="#raven" transform="translate(478 296) rotate(18) scale(0.86)"/>
    <use href="#raven" transform="translate(546 728) rotate(198) scale(0.86)"/>
  </g>
</svg>
